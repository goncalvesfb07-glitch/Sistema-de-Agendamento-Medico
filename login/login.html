<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida+ | Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-container">

        <section class="welcome">
            <div>
                <div class="medical-icon">+</div>

                <h1>Clínica Vida+</h1>

                <p>
                    Sistema de Gestão<br>
                    e Agendamento Médico
                </p>
            </div>

            <span class="secure-text">
                Atendimento integrado e seguro
            </span>
        </section>


        <section class="login-area">

            <div class="header">
                <h2>Bem-vindo!</h2>
                <p>Entre com seus dados para acessar o sistema.</p>
            </div>

            <form id="loginForm">

                <label for="usuario">Usuário</label>

                <div class="input-box">
                    <span>👤</span>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                    >
                </div>


                <label for="senha">Senha</label>

                <div class="input-box">
                    <span>🔒</span>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                    >
                        👁
                    </button>
                </div>


                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Lembrar-me
                    </label>

                    <button
                        type="button"
                        id="forgotPassword"
                    >
                        Esqueci minha senha
                    </button>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                    <span>→</span>
                </button>


                <div id="loginMessage"></div>

            </form>


            <div class="security">
                🔒 Seus dados são protegidos e mantidos em segurança.
            </div>

        </section>

    </main>


    <footer>
        © 2026 Clínica Vida+ — Sistema de Gestão Médica
    </footer>


    <script src="js/login.js"></script>

</body>
</html>
